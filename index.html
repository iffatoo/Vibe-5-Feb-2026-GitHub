<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Desk Booking</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <header class="main-header">
    <div class="header-container">
      <h1 class="app-title">Office Desk Booking System</h1>
      <button id="themeToggle" class="theme-toggle">Toggle Theme</button>
    </div>
  </header>

  <main class="main-content">
    <div class="booking-card">
      <div class="card-header">
        <h2>Book Your Desk for <span id="tomorrowDate"></span></h2>
        <p>Select an available seat below and enter your name to book.</p>
      </div>

      <div class="seat-grid" id="seatGrid">
        <!-- Seats will be rendered here by JavaScript -->
      </div>

      <div class="booking-form-section">
        <h3>Your Booking Details</h3>
        <div class="form-group">
          <label for="userName">Your Name:</label>
          <input type="text" id="userName" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="selectedSeatDisplay">Selected Seat:</label>
          <input type="text" id="selectedSeatDisplay" readonly placeholder="Click a seat to select">
          <input type="hidden" id="selectedSeat" value="">
        </div>
        <button id="bookSeatBtn" class="book-button" disabled>Book Selected Seat</button>
      </div>

      <div class="my-bookings-section">
        <h3>My Bookings for <span id="myBookingsDate"></span></h3>
        <div id="myBookingsList">
          <p>No bookings found for you today.</p>
        </div>
      </div>
    </div>
  </main>
  <script defer type="text/javascript" src="/main.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</body>
</html>
